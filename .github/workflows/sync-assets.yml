name: Sync assets

# Manual: copy the runtime asset subset from the HF bucket into the Space repo.
# Run after changing anything in the bucket's optimized/, scenes/, videos/ or photo/.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=1.0"
      - name: Bucket -> Space data/
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'katospiegel/colectivo-pepita' }}
          HF_BUCKET: ${{ vars.HF_BUCKET || 'katospiegel/colectivo-pepita' }}
        run: python scripts/sync_assets.py --to-space
