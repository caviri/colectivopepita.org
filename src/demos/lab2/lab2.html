<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Antarctic Sampler — Container Lab</title>
        <link rel="stylesheet" href="../../style.css" />
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div id="vignette"></div>
        <canvas id="game"></canvas>
        <div id="loader" class="visible">
            <h1>The Container</h1>
            <p>Powering up…</p>
        </div>

        <div id="hud">
            <div id="hud-top">
                <span id="samples">Samples: 0</span>
                <span id="zone">Zone: container lab</span>
            </div>
            <div id="hud-bottom">
                <div id="prompt"></div>
                <div id="hint">WASD move · click to leave · <kbd>Esc</kbd> menu</div>
            </div>
        </div>

        <button id="new-game" type="button">New Game</button>

        <aside id="todo-list">
            <h3>Mission</h3>
            <ul></ul>
        </aside>

        <div id="hotbar">
            <div class="slot"><span class="num">1</span></div>
            <div class="slot"><span class="num">2</span></div>
            <div class="slot"><span class="num">3</span></div>
            <div class="slot"><span class="num">4</span></div>
            <div class="slot"><span class="num">5</span></div>
            <div class="slot"><span class="num">6</span></div>
            <div class="slot"><span class="num">7</span></div>
            <div class="slot"><span class="num">8</span></div>
            <div class="slot"><span class="num">9</span></div>
            <div class="slot"><span class="num">0</span></div>
        </div>

        <script type="module" src="./lab2.js"></script>
    </body>
</html>
