<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Colectivo Pepita</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
        <style>
            :root {
                --bg-0: #050f24;
                --bg-1: #0a1d40;
                --ink: #e9eefb;
                --ink-dim: #93a6c9;
                --accent: #d8e2f4;
                --panel: rgba(11, 28, 58, 0.50);
                --panel-edge: rgba(150, 180, 230, 0.20);
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body {
                width: 100%; height: 100%; overflow: hidden;
                color: var(--ink);
                font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
                background: linear-gradient(165deg, var(--bg-1) 0%, var(--bg-0) 100%);
            }
            /* Ocean scene (canvas) sits at the back */
            .scene { position: fixed; inset: 0; z-index: 0; display: block; }
            /* Veil keeps the centre readable over bright icebergs */
            .veil {
                position: fixed; inset: 0; z-index: 1; pointer-events: none;
                background: radial-gradient(ellipse 64% 58% at 50% 46%,
                    rgba(5, 15, 36, 0.64), rgba(5, 15, 36, 0.16) 68%, transparent 100%);
            }

            main {
                position: relative; z-index: 2;
                width: 100%; height: 100%;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 28px; text-align: center;
            }
            .title {
                font-family: "Spectral", Georgia, serif; font-weight: 600;
                font-size: clamp(44px, 8.5vw, 88px); line-height: 1.0;
                letter-spacing: -0.5px; color: var(--ink);
                text-shadow: 0 2px 24px rgba(3, 12, 30, 0.6);
            }
            .rule { width: 64px; height: 2px; margin: 22px 0; background: var(--accent); opacity: 0.6; border-radius: 2px; }
            .lede {
                max-width: 540px; font-weight: 400;
                font-size: clamp(15px, 2.1vw, 19px); line-height: 1.6;
                color: var(--ink-dim); margin-bottom: 40px;
                text-shadow: 0 1px 16px rgba(3, 12, 30, 0.55);
            }

            .panel {
                width: min(420px, 92vw);
                background: var(--panel); border: 1px solid var(--panel-edge);
                border-radius: 10px; padding: 22px 22px 18px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                text-align: left;
            }
            .panel label {
                display: block; font-weight: 500; font-size: 12px;
                letter-spacing: 1.4px; text-transform: uppercase;
                color: var(--ink-dim); margin-bottom: 11px;
            }
            .field { display: flex; gap: 10px; }
            input[type="password"] {
                flex: 1; appearance: none; font-family: "Inter", sans-serif; font-size: 16px;
                color: var(--ink); background: rgba(4, 14, 32, 0.6);
                border: 1px solid rgba(150, 180, 230, 0.22);
                border-radius: 7px; padding: 12px 14px; outline: none;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }
            input[type="password"]::placeholder { color: rgba(147, 166, 201, 0.6); }
            input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(120, 160, 230, 0.20); }
            button {
                appearance: none; cursor: pointer; font-family: "Inter", sans-serif;
                font-weight: 600; font-size: 14px; letter-spacing: 0.4px;
                color: #07142b; background: var(--accent);
                border: none; border-radius: 7px; padding: 12px 22px;
                transition: transform 0.08s ease, filter 0.15s ease;
            }
            button:hover { filter: brightness(1.05); }
            button:active { transform: translateY(1px); }

            .error { margin-top: 13px; font-size: 13px; color: #ffc0b4; background: rgba(120, 40, 32, 0.30); border-left: 2px solid #e8654f; border-radius: 4px; padding: 9px 12px; }
            .notice { margin-top: 13px; font-size: 12.5px; line-height: 1.5; color: var(--accent); background: rgba(120, 160, 230, 0.10); border-left: 2px solid var(--accent); border-radius: 4px; padding: 9px 12px; }
            .notice code { font-family: ui-monospace, monospace; background: rgba(0,0,0,0.28); padding: 1px 5px; border-radius: 3px; }
            .hint { margin-top: 14px; text-align: center; font-size: 12px; color: rgba(147, 166, 201, 0.65); }
        </style>
    </head>
    <body>
        <canvas class="scene" aria-hidden="true"></canvas>
        <div class="veil"></div>

        <main>
            <h1 class="title">Colectivo Pepita</h1>
            <div class="rule"></div>
            <p class="lede">Somos un colectivo focalizado en la divulgación de las ciencias antárticas por medio de experiencias interactivas.</p>

            <form class="panel" method="POST" action="/login" autocomplete="off">
                <label for="password">Clave de acceso</label>
                <div class="field">
                    <input id="password" name="password" type="password" placeholder="Introduce la clave" autofocus required />
                    <button type="submit">Acceder</button>
                </div>
                <!--ERROR-->
                <!--NOTICE-->
                <p class="hint">Necesitas la clave para continuar.</p>
            </form>
        </main>

        <script>
            (function () {
                "use strict";
                var canvas = document.querySelector(".scene");
                var ctx = canvas.getContext("2d", { alpha: false });
                if (!ctx) return;
                var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                var W = 0, H = 0, DPR = 1, water = null, bergs = [], raf = 0, last = 0;

                function rand(a, b) { return a + Math.random() * (b - a); }

                // Pre-render one faceted iceberg sprite (drawn once, then blitted each frame).
                // Coordinates are in device pixels; the sprite's bottom edge is the waterline.
                function makeBerg(size) {
                    var pad = Math.max(2, size * 0.16);
                    var bw = size, bh = size * rand(0.55, 0.85);
                    var cw = Math.ceil(bw + pad * 2), ch = Math.ceil(bh + pad);
                    var c = document.createElement("canvas"); c.width = cw; c.height = ch;
                    var g = c.getContext("2d");
                    var x0 = pad, x1 = pad + bw, waterY = ch;
                    var ridgeX = x0 + bw * rand(0.34, 0.62);
                    var peaks = Math.floor(rand(2, 5));
                    var pts = [{ x: x0, y: waterY }];
                    for (var i = 0; i <= peaks; i++) {
                        var x = x0 + bw * i / peaks;
                        var y = waterY - bh * rand(0.42, 0.96);
                        if (Math.abs(x - ridgeX) < (bw / peaks) / 2) y = pad * 0.4; // a tall main peak
                        pts.push({ x: x, y: y });
                    }
                    pts.push({ x: x1, y: waterY });

                    function path() { g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (var k = 1; k < pts.length; k++) g.lineTo(pts[k].x, pts[k].y); g.closePath(); }

                    // body volume: light top -> deep base
                    var grad = g.createLinearGradient(0, pad * 0.4, 0, waterY);
                    grad.addColorStop(0, "#e9f2fc"); grad.addColorStop(0.45, "#aecae8"); grad.addColorStop(1, "#3f679b");
                    path(); g.fillStyle = grad; g.fill();

                    // faceted lighting: sunlit left, shadowed right (clipped to the silhouette)
                    g.save(); path(); g.clip();
                    g.fillStyle = "rgba(18, 46, 86, 0.30)"; g.fillRect(ridgeX, 0, cw - ridgeX, ch);
                    g.fillStyle = "rgba(236, 246, 255, 0.20)"; g.fillRect(0, 0, ridgeX - (ridgeX - x0) * 0.45, ch);
                    g.restore();

                    // crisp ridge + waterline foam
                    g.strokeStyle = "rgba(232, 244, 255, 0.55)"; g.lineWidth = Math.max(1, size * 0.02);
                    g.beginPath(); g.moveTo(x0, waterY - 0.5); g.lineTo(x1, waterY - 0.5); g.stroke();
                    return c;
                }

                function buildBergs() {
                    bergs = [];
                    var N = W < 640 ? 5 : 8;
                    for (var i = 0; i < N; i++) {
                        var z = Math.random();                       // depth: 0 far .. 1 near
                        var sizeCss = H * (0.05 + z * 0.18);
                        var spr = makeBerg(sizeCss * DPR);
                        bergs.push({
                            spr: spr, z: z,
                            cw: spr.width / DPR, ch: spr.height / DPR,
                            x: Math.random() * W,
                            y: H * (0.32 + z * 0.50) + rand(-18, 18),  // waterline y for this berg
                            vx: -(8 + z * 34),                          // camera pan: all drift left, near faster
                            bobA: 1.5 + z * 3, bobS: 0.4 + Math.random() * 0.5, bobP: Math.random() * 6.283,
                            alpha: 0.5 + 0.5 * z
                        });
                    }
                    // icebergs diminutos y lejanos, dispersos junto al horizonte (más numerosos y tenues)
                    var tinyN = W < 640 ? 12 : 20;
                    for (var j = 0; j < tinyN; j++) {
                        var tz = Math.random() * 0.22;
                        var tCss = H * (0.012 + Math.random() * 0.024);
                        var tspr = makeBerg(tCss * DPR);
                        bergs.push({
                            spr: tspr, z: tz,
                            cw: tspr.width / DPR, ch: tspr.height / DPR,
                            x: Math.random() * W,
                            y: H * (0.30 + Math.random() * 0.16),
                            vx: -(4 + tz * 14),
                            bobA: 0.5 + tz * 1.0, bobS: 0.4 + Math.random() * 0.5, bobP: Math.random() * 6.283,
                            alpha: 0.26 + tz * 0.5
                        });
                    }
                    bergs.sort(function (a, b) { return a.z - b.z; });  // far first, near drawn on top
                }

                function resize() {
                    DPR = Math.min(window.devicePixelRatio || 1, 2);
                    W = window.innerWidth; H = window.innerHeight;
                    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
                    canvas.style.width = W + "px"; canvas.style.height = H + "px";
                    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                    water = ctx.createLinearGradient(0, 0, 0, H);
                    water.addColorStop(0, "#01040b");     // cielo (más oscuro)
                    water.addColorStop(0.30, "#050e20");  // horizonte oscuro
                    water.addColorStop(0.58, "#0a1c3c");  // agua
                    water.addColorStop(1, "#040b18");     // profundo
                    buildBergs();
                }

                function drawWaves(t) {
                    var rows = 7;
                    for (var i = 0; i < rows; i++) {
                        var f = i / rows;
                        var baseY = H * (0.28 + 0.72 * f);
                        var amp = 2 + 6 * f, k = 0.008 + 0.004 * i, sp = 0.3 + 0.2 * i;
                        ctx.beginPath();
                        for (var x = 0; x <= W; x += 24) {
                            var y = baseY + Math.sin(x * k + t * sp + i) * amp;
                            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = "rgba(150, 188, 232, " + (0.03 + 0.06 * f) + ")";
                        ctx.lineWidth = 1; ctx.stroke();
                    }
                }

                // Reflejo deformado por el oleaje: se dibuja en rodajas horizontales,
                // cada una desplazada por una onda (dos senos ~ pseudo-ruido) que crece con
                // la profundidad y oscila con un "swell" lento (marea).
                function drawReflection(b, x, y, t) {
                    var sh = b.spr.height, sw = b.spr.width;
                    var reflH = b.ch * 0.55;
                    var slices = Math.max(3, Math.min(14, Math.round(b.ch / 6)));
                    var tide = 0.6 + 0.4 * Math.sin(t * 0.5 + b.bobP);
                    ctx.save();
                    for (var k = 0; k < slices; k++) {
                        var d0 = k / slices, d1 = (k + 1) / slices, dep = (d0 + d1) / 2;
                        var amp = (1.5 + dep * 9) * tide;
                        var off = Math.sin(dep * 16 + t * 2.2 + b.bobP) * amp
                                + Math.sin(dep * 7 - t * 1.3 + b.bobP * 1.7) * amp * 0.4;
                        var a = 0.17 * b.alpha * (1 - dep * 0.7);
                        if (a <= 0.01) continue;
                        ctx.globalAlpha = a;
                        ctx.drawImage(b.spr,
                            0, sh * (1 - d1), sw, sh * (d1 - d0),                 // franja de origen (espejo)
                            x - b.cw / 2 + off, y + d0 * reflH, b.cw, (d1 - d0) * reflH + 0.6);
                    }
                    ctx.restore();
                }

                function drawBerg(b, t) {
                    var bob = Math.sin(t * b.bobS + b.bobP) * b.bobA;
                    var y = b.y + bob;
                    // contact shadow on the water
                    ctx.save();
                    ctx.globalAlpha = 0.20 * b.alpha; ctx.fillStyle = "#03132b";
                    ctx.beginPath(); ctx.ellipse(b.x, y, b.cw * 0.46, b.ch * 0.06, 0, 0, 6.283); ctx.fill();
                    ctx.restore();
                    // reflejo deformado por el oleaje
                    drawReflection(b, b.x, y, t);
                    // the berg itself (slight rock for life)
                    ctx.save();
                    ctx.globalAlpha = b.alpha;
                    ctx.translate(b.x, y); ctx.rotate(Math.sin(t * b.bobS * 0.7 + b.bobP) * 0.02);
                    ctx.drawImage(b.spr, -b.cw / 2, -b.ch, b.cw, b.ch);
                    ctx.restore();
                }

                function render(t) {
                    ctx.fillStyle = water; ctx.fillRect(0, 0, W, H);
                    drawWaves(t);
                    for (var i = 0; i < bergs.length; i++) drawBerg(bergs[i], t);
                }

                function frame(ts) {
                    var t = ts / 1000;
                    var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0; last = ts;
                    var margin = 60;
                    for (var i = 0; i < bergs.length; i++) {
                        var b = bergs[i];
                        b.x += b.vx * dt;
                        if (b.x < -b.cw / 2 - margin) b.x = W + b.cw / 2 + margin; // wrap to the other side
                        else if (b.x > W + b.cw / 2 + margin) b.x = -b.cw / 2 - margin;
                    }
                    render(t);
                    raf = window.requestAnimationFrame(frame);
                }

                function start() { if (!raf) { last = 0; raf = window.requestAnimationFrame(frame); } }
                function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = 0; } }

                var rt;
                window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { resize(); if (reduce) render(0); }, 180); });
                document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else if (!reduce) start(); });

                resize();
                if (reduce) render(0); else start();   // static single frame if reduced-motion
            })();
        </script>
    </body>
</html>
